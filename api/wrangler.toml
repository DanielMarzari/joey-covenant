name = "csb-admin"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Intercepts /api/* and /admin* on the live domain before GHL sees them.
# Everything else passes straight through to GoHighLevel — the existing
# www CNAME (sites.ludicrous.cloud) is untouched.
#
# Requires Cloudflare account access to deploy. Until then `wrangler dev`
# runs the whole thing locally against a real Workers runtime.
[[routes]]
pattern = "www.covenantseniorbenefits.com/api/*"
zone_name = "covenantseniorbenefits.com"

[[routes]]
pattern = "www.covenantseniorbenefits.com/admin*"
zone_name = "covenantseniorbenefits.com"

[[d1_databases]]
binding = "DB"
database_name = "csb"
database_id = "00000000-0000-0000-0000-000000000000"  # replaced on first `wrangler d1 create csb`

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "csb-photos"

[vars]
SESSION_TTL_HOURS = "12"
PUBLIC_CACHE_SECONDS = "60"

# Secret, set with: npx wrangler secret put ADMIN_PASSWORD_HASH
# Generate the value with: npm run hash -- 'the-password'
